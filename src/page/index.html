<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuloy</title>
<link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/page/style.css">
<script type="module" src="/page/app.ts"></script>
</head>
<body>
<header class="bar">
  <p class="mark">Tuloy <span id="owner" class="owner"></span> <span id="demo-tag" class="tag tag-demo" hidden>Demo mode</span></p>
  <nav class="nav" aria-label="Screens"><a href="/" aria-current="page">Runs</a><a href="/peers">Peers</a></nav>
</header>

<section class="starter" aria-label="Start a run">
  <form id="goal-form" class="goal-form">
    <label for="goal-input">Your goal</label>
    <input id="goal-input" required maxlength="2000" autocomplete="off" placeholder="One sentence of work for the agents">
    <button>Start this goal</button>
  </form>
  <div class="sample">
    <p><span class="tag">Sample goal</span> <span id="sample-goal"></span></p>
    <button id="start" type="button">Start the sample goal</button>
  </div>
  <p id="start-note" class="start-note" role="status"></p>
</section>

<main>
  <section id="slate" class="slate" aria-live="polite">
    <p class="slate-note">Reading the runs…</p>
  </section>

  <div class="desk">
    <section class="tasks" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Tasks</h2>
      <ol id="tasks" class="task-list"></ol>
    </section>

    <section class="trail" aria-labelledby="trail-title">
      <h2 id="trail-title">Event trail</h2>
      <ol id="trail" class="trail-list"></ol>
    </section>

    <aside class="rail">
      <section aria-labelledby="runs-title">
        <h2 id="runs-title">Past runs</h2>
        <ol id="runs" class="run-list"></ol>
      </section>
      <section id="demo" class="demo" aria-labelledby="demo-title" hidden>
        <h2 id="demo-title"><span class="tag tag-demo">Demo</span> Injections</h2>
        <p>An injection is a failure made on purpose, to show a recovery. It is not a real failure.</p>
        <label for="demo-task">Agent to fail</label>
        <select id="demo-task"></select>
        <div id="demo-kinds" class="demo-kinds"></div>
        <p id="demo-note" class="demo-note" role="status"></p>
        <ul id="demo-pending" class="demo-pending"></ul>
      </section>
    </aside>
  </div>

  <section id="result" class="result" aria-labelledby="result-title"></section>
</main>
</body>
</html>
