# The second Tuloy on Fly.io: Sam, the sample owner. It is a peer of the Tuloy in fly.toml. Deploy it with: fly deploy --config fly.sam.toml --ha=false
# The key and the password are secrets of the app, never in this file:
#   fly secrets set OPENROUTER_API_KEY=... TULOY_DASHBOARD_PASSWORD=...
app = "tuloy-sam"
primary_region = "sin" # Singapore: the nearest region to Manila

[env]
  TULOY_OWNER = "Sam (sample owner)"
  TULOY_PUBLIC_HOST = "tuloy-sam.fly.dev"
  TULOY_PRIMARY_MODEL = "anthropic/claude-sonnet-5.5"
  TULOY_BACKUP_MODEL = "openai/gpt-6.1-terra"

# The data folder: the runs, the events and the allowed list. The first deploy makes the disk.
[mounts]
  source = "tuloy_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stays on: a run and the work for a peer go on when no browser is open.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
